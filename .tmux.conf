set -g mouse on
bind r source-file ~/.tmux.conf


# theme
set -g @STATUS_BG '#24273a'
set -g @TAB_BG '#24273a'

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=blue bg=#{@STATUS_BG}'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=green'
set -g status-right '#[fg=green bg=#{@STATUS_BG}]#[fg=black bg=green] #S '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bold bg=yellow'
setw -g window-status-current-format ' #I #W  #[fg=yellow bg=#{@STATUS_BG}]'

setw -g window-status-style 'fg=blue bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow] #[fg=black bg=#{@STATUS_BG}]'

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'

setw -g mode-keys vi

# macOS: copy to system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Also copy on mouse drag end (if mouse mode is enabled)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

