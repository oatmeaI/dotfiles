
set -g mouse on
bind r source-file ~/.config/tmux/tmux.conf

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=blue bg=#{@STATUS_BG}'

set -g status-left ''
set -g status-left-length 10
set -g status-justify centre

set -g status-right-style 'fg=black bg=green'

#  █ 

# theme
set -g @BAR_BG '#24273a'
set -g @STATUS_COLOR 'green'
set -g @WIN_COLOR 'black'

set -g @STATUS_PILL_LEFT "#[fg=#{@STATUS_COLOR},bg=#{@BAR_BG}] #[bg=#{@STATUS_COLOR},fg=#{@BAR_BG}]"
set -g @STATUS_PILL_RIGHT "#[fg=#{@STATUS_COLOR},bg=#{@BAR_BG}] #[bg=#{@STATUS_COLOR},fg=#{@BAR_BG}]"

set -g @WIN_PILL_LEFT "#[fg=#{@WIN_COLOR},bg=#{@BAR_BG}] #[bg=#{@WIN_COLOR},fg=white]"
set -g @WIN_PILL_RIGHT "#[fg=#{@WIN_COLOR},bg=#{@BAR_BG}] #[bg=#{@WIN_COLOR},fg=#{@BAR_BG}]"

set -g @CUR_WIN_PILL_LEFT "#[fg=yellow,bg=#{@BAR_BG}] #[bg=yellow,fg=black bold]"
set -g @CUR_WIN_PILL_RIGHT "#[fg=yellow,bg=#{@BAR_BG}] #[bg=#{@WIN_COLOR},fg=#{@BAR_BG}]"

set -g status-right '#{E:@STATUS_PILL_LEFT} #S #{E:@STATUS_PILL_RIGHT}'
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bold bg=yellow'
setw -g window-status-current-format '#{E:@CUR_WIN_PILL_LEFT} (#I) #W  #{E:@CUR_WIN_PILL_RIGHT}'

setw -g window-status-style 'fg=white bg=black'
setw -g window-status-format '#{E:@WIN_PILL_LEFT} (#I) #W #{E:@WIN_PILL_RIGHT}'

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'

setw -g mode-keys vi

# macOS: copy to system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Also copy on mouse drag end (if mouse mode is enabled)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Initialize tpack (keep this line at the very bottom of tmux.conf)
run 'tpack init'
